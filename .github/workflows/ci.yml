name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: link-router
            go-version: "1.25"
          - service: link-admin
            go-version: "1.25"
          - service: analytics-worker
            go-version: "1.25"
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -cover

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
