apiVersion: v1
kind: ConfigMap
metadata:
  name: wsminoro-config
data:
  kafka-brokers: "kafka:9092"
  cassandra-keyspace: "link_analytics"
  # TODO: set to the real dashboard origin before deploying — it isn't in
  # ingress.yaml yet (only the router and API subdomains are routed there).
  frontend-origin: "https://dashboard.example.com"
  cookie-secure: "true"
  # Billing (Pagar.me) — plan IDs from your Pagar.me dashboard's Plans
  # product. Leave blank (or drop the keys) to run without billing.
  pagarme-plan-id-starter: ""
  pagarme-plan-id-pro: ""
  pagarme-plan-id-business: ""
