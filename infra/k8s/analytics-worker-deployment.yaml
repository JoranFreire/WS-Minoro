apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  labels:
    app: analytics-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      containers:
        - name: analytics-worker
          image: wsminoro/analytics-worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: HEALTH_PORT
              value: "8082"
            - name: KAFKA_GROUP_ID
              value: "analytics-worker"
            - name: KAFKA_TOPIC
              value: "click.raw"
            - name: CASSANDRA_HOSTS
              value: "cassandra"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: redis-url
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: kafka-brokers
            - name: CASSANDRA_KEYSPACE
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: cassandra-keyspace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: analytics-worker-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: analytics-worker
