apiVersion: apps/v1
kind: Deployment
metadata:
  name: link-admin
  labels:
    app: link-admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: link-admin
  template:
    metadata:
      labels:
        app: link-admin
    spec:
      containers:
        - name: link-admin
          image: wsminoro/link-admin:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: redis-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: jwt-secret
            - name: FRONTEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: frontend-origin
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: cookie-secure
            # Billing (Pagar.me) — optional. Omit these from wsminoro-secrets
            # entirely to run without billing; BillingService then reports
            # "not configured" instead of failing to start.
            - name: PAGARME_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: pagarme-secret-key
                  optional: true
            - name: PAGARME_WEBHOOK_USER
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: pagarme-webhook-user
                  optional: true
            - name: PAGARME_WEBHOOK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wsminoro-secrets
                  key: pagarme-webhook-password
                  optional: true
            - name: PAGARME_PLAN_ID_STARTER
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: pagarme-plan-id-starter
                  optional: true
            - name: PAGARME_PLAN_ID_PRO
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: pagarme-plan-id-pro
                  optional: true
            - name: PAGARME_PLAN_ID_BUSINESS
              valueFrom:
                configMapKeyRef:
                  name: wsminoro-config
                  key: pagarme-plan-id-business
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: link-admin
spec:
  selector:
    app: link-admin
  ports:
    - port: 80
      targetPort: 8081
  type: ClusterIP
